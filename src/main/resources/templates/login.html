<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理员登录</title>
    <link rel="stylesheet" th:href="${contextPath} + '/assets/app.css'">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-intro">
        <p class="eyebrow">JAVA WEB LEARNING PROJECT</p>
        <h1>Servlet 核心知识。</h1>
        <p>登录后管理图书、学生和借阅记录；开发者实验室用于观察 HTTP、Session、Filter、Listener 与 Tomcat 运行机制。</p>
        <a th:href="${contextPath} + '/lab'">无需登录，进入开发者实验室 →</a>
    </section>
    <section class="login-card">
        <div><span class="brand-mark large">JW</span></div>
        <h2>管理员登录</h2>
        <p class="muted">请输入数据库中的管理员账号。</p>
        <div class="flash error" th:if="${error != null}" th:text="${error}">登录失败</div>
        <form th:action="${contextPath} + '/login'" method="post" class="stack-form">
            <input type="hidden" name="next" th:value="${next}">
            <label>用户名<input name="username" autocomplete="username" required maxlength="50"
                            th:value="${rememberedUsername}" placeholder="admin"></label>
            <label>密码<input type="password" name="password" autocomplete="current-password" required placeholder="••••••••"></label>
            <label class="checkbox"><input type="checkbox" name="remember" th:checked="${rememberedUsername != null and !rememberedUsername.isEmpty()}"> 记住用户名 7 天</label>
            <button class="button primary full" type="submit">登录系统</button>
        </form>
    </section>
</main>
</body>
</html>
