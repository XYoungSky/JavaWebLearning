<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>借阅管理</title><link rel="stylesheet" th:href="${contextPath} + '/assets/app.css'"></head>
<body>
<div th:replace="~{fragments :: header('借阅管理', ${activePage})}"></div>
<main class="page-container">
    <div th:replace="~{fragments :: pageTitle('CIRCULATION', '借阅管理', '登记借阅、查看历史，并完成归还。事务保证图书状态与借阅记录一致。')}"></div>
    <div th:replace="~{fragments :: flash}"></div>
    <section class="panel form-panel">
        <div><h2>新增借阅</h2><p th:if="${availableBooks.isEmpty()}">当前没有可借图书。</p><p th:unless="${availableBooks.isEmpty()}">选择一本可借图书和一位学生。</p></div>
        <form class="inline-form loan-form" th:action="${contextPath} + '/loans/create'" method="post">
            <label>图书<select name="bookId" required><option value="">请选择图书</option><option th:each="book : ${availableBooks}" th:value="${book.id}" th:text="${book.title} + ' · ' + ${book.isbn}">图书</option></select></label>
            <label>学生<select name="studentId" required><option value="">请选择学生</option><option th:each="student : ${students}" th:value="${student.id}" th:text="${student.name} + ' · ' + ${student.studentNo}">学生</option></select></label>
            <button class="button primary" type="submit" th:disabled="${availableBooks.isEmpty() or students.isEmpty()}">登记借阅</button>
        </form>
    </section>
    <section class="panel table-panel">
        <div class="panel-heading"><h2>借阅记录</h2><span class="count"><b th:text="${loans.size()}">0</b> 条</span></div>
        <div class="empty-state" th:if="${loans.isEmpty()}">暂无借阅记录。</div>
        <div class="table-scroll" th:unless="${loans.isEmpty()}"><table>
            <thead><tr><th>图书</th><th>学生</th><th>借出时间</th><th>归还时间</th><th>状态</th><th></th></tr></thead>
            <tbody><tr th:each="loan : ${loans}">
                <td><strong th:text="${loan.bookTitle}">书名</strong><small class="mono" th:text="${loan.isbn}">ISBN</small></td>
                <td><strong th:text="${loan.studentName}">姓名</strong><small th:text="${loan.studentNo}">学号</small></td>
                <td class="mono small" th:text="${loan.borrowedAt}">时间</td><td class="mono small" th:text="${loan.returnedAt != null ? loan.returnedAt : '—'}">时间</td>
                <td><span class="badge" th:classappend="${loan.active} ? ' borrowed' : ' available'" th:text="${loan.active ? '借阅中' : '已归还'}">状态</span></td>
                <td class="actions"><form th:if="${loan.active}" th:action="${contextPath} + '/loans/return'" method="post"><input type="hidden" name="id" th:value="${loan.id}"><button class="link-button" type="submit">归还</button></form></td>
            </tr></tbody>
        </table></div>
    </section>
</main>
</body></html>
